<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fa6a6"/></marker><linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16201f"/><stop offset="1" stop-color="#0f1515"/></linearGradient></defs>
<rect width="1000" height="250" rx="12" fill="#0b0c10"/>
