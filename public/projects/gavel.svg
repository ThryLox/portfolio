<text x="300" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#e3e8ee">Test prompts</text>
<text x="300" y="120" text-anchor="middle" font-size="13" fill="#8b97a8">one per rule</text>
<text x="226" y="48" font-size="11" fill="#3fa6a6">02</text>
<line x1="389" y1="104.0" x2="411" y2="104.0" stroke="#3fa6a6" stroke-width="1.5" marker-end="url(#arrow)"/>
