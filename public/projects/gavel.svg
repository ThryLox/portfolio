<text x="100" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#e3e8ee">YAML rules</text>
<text x="100" y="120" text-anchor="middle" font-size="13" fill="#8b97a8">SEC-* and LAW-*</text>
<text x="26" y="48" font-size="11" fill="#3fa6a6">01</text>
